<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>秘密の種と宝探し</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one centered column. Title and counter on top, stage and sound tools below, a framed board in the middle, tap/long-press guide under it.
   Two worlds share the layout and swap their tokens: flower garden (soil, brick, pink) and treasure island (sand, sea-teal frame, gold). */
:root{
  --bg:#fff3e8; --bg-a:#ffe2ec; --bg-b:#fff1b8; --bg-c:#e2f4dc;
  --ink:#5a3a28; --ink-soft:#8a6854;
  --card:rgba(255,255,255,.8); --line:#f0d9c4;
  --soil:#c98e62; --soil-wet:#9c6644; --dots:rgba(80,40,10,.17);
  --box:#b17b53; --box-in:#8f5f3d; --box-edge:#8f5f3d; --box-glow:rgba(120,70,30,.22);
  --dug:#fcf1e0; --found:#ffe8a3; --meadow:#bfe6ae; --glow:rgba(255,150,190,.75);
  --ring:#4fb3e6; --focus:#2f8a4a; --ring-line:#fff; --cross:#e5646f;
  --gloss:rgba(255,255,255,.3); --edge-hi:rgba(255,255,255,.28); --edge-lo:rgba(70,30,0,.18);
  --celebrate-line:#fff; --panel-line:#fff; --armed-bg:#fff; --seg-bg:#fff;
  --celebrate-bg:linear-gradient(120deg,#fff3b8,#ffd3e4); --celebrate-ink:#bb3563;
  --panel-bg:linear-gradient(160deg,#fff7d6,#ffe0ec); --panel-glow:rgba(255,140,170,.3);
  --next-bg:#86d696; --next-edge:#4aa862; --next-ink:#123b1d;
  --acc:#e0709a;
  --lv0:#cdeed2; --lv1:#fde7a8; --lv2:#ffd0dc; --lv3:#dccdfb; --lv-ink:#4a3322;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
/* treasure island: dark navy and charcoal ruins, gold and emerald accents */
:root[data-world="treasure"]{
  color-scheme:dark;
  --bg:#0d1322; --bg-a:#17304a; --bg-b:#2b2410; --bg-c:#0f3b34;
  --ink:#f3ead2; --ink-soft:#b9b09a;
  --card:rgba(24,32,52,.86); --line:#37435f;
  --soil:#3d4863; --soil-wet:#141b2c; --dots:rgba(255,255,255,.07);
  --gloss:rgba(255,255,255,.12); --edge-hi:rgba(255,255,255,.12); --edge-lo:rgba(0,0,0,.4);
  --box:#c9a24a; --box-in:#161e31; --box-edge:#8a6a1e; --box-glow:rgba(0,0,0,.55);
  --dug:#212a40; --found:#3a3220; --glow:rgba(232,195,90,.9);
  --ring:#e8c35a; --ring-line:#e8c35a; --focus:#e8c35a; --cross:#ff7d8a;
  --celebrate-bg:linear-gradient(120deg,#3a2f12,#103a31); --celebrate-ink:#ffe39a; --celebrate-line:#e8c35a;
  --panel-bg:linear-gradient(160deg,#1d2b42,#113a31); --panel-glow:rgba(232,195,90,.25); --panel-line:#e8c35a;
  --next-bg:#e8c35a; --next-edge:#9a7a22; --next-ink:#1b1403;
  --lv0:#1f6b52; --lv1:#6b5a1f; --lv2:#7a3a4a; --lv3:#4d3d8a; --lv-ink:#fff7e0;
  --armed-bg:#2b3550; --seg-bg:#1c2438; --acc:#e8c35a;
}
:root[data-world="treasure"] .cell.n1{color:#7fb2ff}
:root[data-world="treasure"] .cell.n2{color:#5ee2a0}
:root[data-world="treasure"] .cell.n3{color:#ff8fa3}
:root[data-world="treasure"] .cell.n4{color:#c3a2ff}
:root[data-world="treasure"] .cell.n5{color:#ffb86b}
:root[data-world="treasure"] .cell.n6{color:#5fe0e8}
:root[data-world="treasure"] .cell.n7{color:#d6cfc0}
:root[data-world="treasure"] .cell.n8{color:#ffffff}
html{height:100%}
body{
  min-height:100%;margin:0;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 8% 6%,var(--bg-a),transparent 42%),
    radial-gradient(circle at 96% 34%,var(--bg-b),transparent 36%),
    radial-gradient(circle at 12% 96%,var(--bg-c),transparent 44%);
  color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%;
}
.app{
  box-sizing:border-box;max-width:460px;margin:0 auto;
  display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 28px;
}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.head>div:first-child{min-width:0}
h1{margin:0;font-size:clamp(21px,6.2vw,28px);font-weight:900;letter-spacing:.02em;line-height:1.15;text-wrap:balance}
.en{margin:5px 0 0;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
.pill{
  background:var(--card);border:2px solid var(--line);border-radius:999px;
  padding:6px 14px;font-weight:700;font-size:14px;min-height:30px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.pill b{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.rem{padding-left:8px}
.rem img{width:28px;height:28px;border-radius:8px;display:block}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lv{border-radius:999px;padding:2px 10px;font-size:13px;font-weight:900;color:var(--lv-ink);background:var(--lv0)}
.lv.lv1{background:var(--lv1)}.lv.lv2{background:var(--lv2)}.lv.lv3{background:var(--lv3)}
.tools{display:flex;gap:8px}
.ibtn{
  appearance:none;-webkit-appearance:none;position:relative;display:grid;place-items:center;
  width:44px;height:44px;padding:0;border-radius:50%;font:inherit;font-size:20px;line-height:1;color:var(--ink);
  background:var(--card);border:2px solid var(--line);cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.ibtn:active{transform:scale(.94)}
.ibtn:disabled{opacity:.35;cursor:default;transform:none}
.ibtn[aria-pressed="false"]{opacity:.55}
.ibtn[aria-pressed="false"]::after{content:"";position:absolute;width:28px;height:3px;border-radius:2px;background:var(--ink-soft);transform:rotate(-45deg)}
.ibtn.armed{border-color:var(--ring);background:var(--armed-bg)}
.status{
  margin:0;box-sizing:border-box;background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:10px 14px;min-height:64px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:700;font-size:15px;line-height:1.45;text-wrap:balance;
}
.status.pop{animation:msg .35s ease}
.status.celebrate{
  background:var(--celebrate-bg);border-color:var(--celebrate-line);color:var(--celebrate-ink);
  font-size:clamp(18px,5.4vw,22px);font-weight:900;box-shadow:0 8px 20px var(--panel-glow);
}
@keyframes msg{from{transform:scale(.96);opacity:.5}to{transform:scale(1);opacity:1}}

.box{background:var(--box);border-radius:24px;padding:10px;box-shadow:0 6px 0 var(--box-edge),0 14px 24px var(--box-glow)}
.grid{
  container-type:inline-size;box-sizing:border-box;width:100%;aspect-ratio:1/1;
  display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:4px;padding:4px;
  background:var(--box-in);border-radius:16px;
  -webkit-touch-callout:none;
}
.cell{
  appearance:none;-webkit-appearance:none;border:0;margin:0;padding:0;min-width:0;min-height:0;position:relative;
  display:grid;place-items:center;border-radius:26%;
  font:inherit;font-size:clamp(14px,5.6vw,26px);font-size:6.3cqw;font-weight:900;line-height:1;color:var(--ink);
  background-color:var(--soil);
  background-image:linear-gradient(155deg,var(--gloss),rgba(255,255,255,0) 50%),radial-gradient(var(--dots) 1.1px,transparent 1.7px);
  background-size:100% 100%,10px 10px;
  box-shadow:inset 0 -3px 0 var(--edge-lo),inset 0 2px 0 var(--edge-hi);
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:background-color .7s ease,transform .12s ease;
}
.cell:focus-visible,.next:focus-visible,.ibtn:focus-visible,.how summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cell:focus-visible{z-index:3}
.g{position:relative;display:block;pointer-events:none}
.mk{position:absolute;left:24%;top:24%;width:52%;height:52%;fill:none;stroke:var(--cross);stroke-width:3.2;stroke-linecap:round;opacity:.5;pointer-events:none;overflow:visible}
.mk.zero{opacity:.85}

.cell.pressing{animation:hold .42s ease-out forwards;z-index:2}
.cell.pressing::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:3px solid var(--ring);opacity:0;animation:holdring .42s ease-out forwards;pointer-events:none}
@keyframes hold{to{transform:scale(.88);filter:brightness(1.1)}}
@keyframes holdring{to{opacity:1}}

/* tapped (safe) cell: brick in the garden, crossed sand in the treasure island */
:root[data-world="flower"] .cell.safe{
  --mortar:rgba(255,244,230,.8);
  background-color:#d98a6c;
  background-image:
    linear-gradient(155deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),
    linear-gradient(to bottom,transparent calc(50% - 1px),var(--mortar) calc(50% - 1px),var(--mortar) calc(50% + 1px),transparent calc(50% + 1px)),
    linear-gradient(to right,transparent calc(50% - 1px),var(--mortar) calc(50% - 1px),var(--mortar) calc(50% + 1px),transparent calc(50% + 1px)),
    linear-gradient(to right,transparent calc(25% - 1px),var(--mortar) calc(25% - 1px),var(--mortar) calc(25% + 1px),transparent calc(25% + 1px),transparent calc(75% - 1px),var(--mortar) calc(75% - 1px),var(--mortar) calc(75% + 1px),transparent calc(75% + 1px));
  background-size:100% 100%,100% 100%,100% 50%,100% 50%;
  background-position:0 0,0 0,0 0,0 100%;
  background-repeat:no-repeat;
  box-shadow:inset 0 -3px 0 rgba(90,30,10,.25),inset 0 2px 0 rgba(255,255,255,.25);
}
:root[data-world="flower"] .cell.safe .g{
  width:64%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;
  background:#fff6e8;box-shadow:0 1px 0 rgba(90,30,10,.3);
}
:root[data-world="treasure"] .cell.safe{background-image:none;background-color:var(--dug);box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
.cell.n1{color:#2f6bc4}.cell.n2{color:#237a3b}.cell.n3{color:#c93a54}.cell.n4{color:#7b4fc9}
.cell.n5{color:#b0561a}.cell.n6{color:#0f7480}.cell.n7{color:#6b5b4b}.cell.n8{color:#3a2a20}

.cell.found{background-image:none;background-color:var(--found);box-shadow:inset 0 0 0 2px rgba(240,180,40,.55)}
.cell.found .g{font-size:1.15em}
.cell.claim{background-color:var(--soil-wet);box-shadow:inset 0 -3px 0 rgba(30,10,0,.25),inset 0 2px 0 rgba(255,255,255,.18)}
.cell.claim .g{font-size:1.15em}
.cell.claim .g.gold{width:100%;height:100%;font-size:inherit}
.g.gold svg{display:block;width:100%;height:100%}

.fx-sprout{animation:ring .6s ease-out}
.fx-sprout .g{animation:sprout .5s cubic-bezier(.2,1.3,.4,1)}
.fx-reveal{animation:reveal .32s ease-out backwards;animation-delay:var(--d,0ms)}
.fx-shake{animation:shake .3s}
.fx-found{animation:found .7s ease 2}
@keyframes sprout{0%{transform:scale(.2) translateY(30%)}60%{transform:scale(1.3) translateY(-6%)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--ring)}100%{box-shadow:0 0 0 10px transparent}}
@keyframes reveal{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes found{0%,100%{transform:scale(1)}40%{transform:scale(1.14)}70%{transform:scale(.96)}}

/* clear: every hidden cell shows this stage's icon */
.cell.bloom,.cell.rise{
  z-index:2;background-image:var(--ico);background-size:cover;background-position:center;background-color:transparent;
  box-shadow:0 0 0 2px var(--ring-line),0 0 16px var(--glow);transform:scale(1.14);
  animation:bloomin .9s cubic-bezier(.2,1.2,.4,1) both;animation-delay:var(--d,0ms);
}
.cell.rise{animation-name:risein}
@keyframes bloomin{0%{transform:scale(.2) rotate(-25deg);opacity:0}55%{transform:scale(1.4) rotate(6deg);opacity:1}100%{transform:scale(1.14) rotate(0)}}
@keyframes risein{0%{transform:translateY(40%) scale(.3);opacity:0}60%{transform:translateY(-14%) scale(1.4);opacity:1}100%{transform:scale(1.14)}}
.cell.meadow{background-color:var(--meadow);transition:background-color .8s ease var(--d,0ms)}
.cell.meadow .g{width:70%;aspect-ratio:1;border-radius:24%;background-image:var(--ico);background-size:cover;animation:meadow .6s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:var(--d,0ms)}
@keyframes meadow{from{transform:scale(0)}to{transform:scale(1)}}
.grid.done .cell{cursor:default}

.howto{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.howto[hidden]{display:none}
.hcard{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;min-height:56px}
.hi{font-size:26px;line-height:1}
.hcard b{display:block;font-size:15px;font-weight:900}
.hcard small{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);line-height:1.35}

.clear{
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  background:var(--panel-bg);border:3px solid var(--panel-line);border-radius:26px;padding:16px;
  box-shadow:0 10px 26px var(--panel-glow);
  animation:panel .7s cubic-bezier(.2,1.2,.4,1) .9s backwards;
}
.clear p{margin:0;font-weight:700;font-size:15px;line-height:1.5}
.next{
  appearance:none;-webkit-appearance:none;font:inherit;font-size:18px;font-weight:900;color:var(--next-ink);
  background:var(--next-bg);border:3px solid var(--next-edge);box-shadow:0 4px 0 var(--next-edge);border-radius:999px;
  min-height:56px;padding:0 28px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.next:active{transform:translateY(2px);box-shadow:0 2px 0 var(--next-edge)}
@keyframes panel{from{transform:translateY(16px) scale(.94);opacity:0}to{transform:none;opacity:1}}

.how{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:0 14px;font-size:14px;line-height:1.65}
.how summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:900;padding:12px 0;list-style:none}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"＋";color:var(--ink-soft)}
.how[open] summary::after{content:"－"}
.how ul{margin:0 0 12px;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:12px}
.seg button{
  appearance:none;-webkit-appearance:none;font:inherit;font-size:14px;font-weight:700;min-height:44px;border-radius:14px;
  border:2px solid var(--line);background:var(--seg-bg);color:var(--ink-soft);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.seg button[aria-checked="true"]{background:var(--next-bg);border-color:var(--next-edge);color:var(--next-ink)}
.seg button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.fall{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:50}
.fall i{position:absolute;top:0;display:block;will-change:transform;animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:backwards}
.fall .petal{border-radius:100% 0 100% 0;opacity:.94;filter:drop-shadow(0 1px 1px rgba(120,80,60,.3));animation-name:fall}
.fall .coin{
  border-radius:50%;border:2px solid #c98a10;box-sizing:border-box;
  background:radial-gradient(circle at 35% 30%,#fff7b8 0 16%,#ffd84d 38%,#f0a915 72%,#b9780c 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);animation-name:coinfall;
}
@keyframes fall{
  0%{transform:translate3d(0,-8vh,0) rotate(0deg)}
  25%{transform:translate3d(calc(var(--drift) * .4),25vh,0) rotate(120deg)}
  50%{transform:translate3d(calc(var(--drift) * -.3),55vh,0) rotate(260deg)}
  100%{transform:translate3d(var(--drift),112vh,0) rotate(var(--spin))}
}
@keyframes coinfall{
  0%{transform:translate3d(0,-10vh,0) perspective(300px) rotateY(0deg)}
  100%{transform:translate3d(var(--drift),112vh,0) perspective(300px) rotateY(var(--spin))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .fall{display:none}
}

/* views: home / game / stamp card / records share one column */
.view{display:flex;flex-direction:column;gap:12px}
.view[hidden]{display:none}
.toolrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.timer{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 14px;font-size:12px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.timer b{font-size:18px;font-weight:900;color:var(--ink)}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:22px 0 6px}
.hero .row{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.hero img{width:52px;height:52px;border-radius:16px;display:block;box-shadow:0 3px 0 var(--line);animation:bob 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{50%{transform:translateY(-6px)}}
.resume{margin:0;text-align:center;font-weight:700;font-size:15px;line-height:1.5;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.note{margin:0;text-align:center;font-size:12px;font-weight:700;line-height:1.5;color:var(--ink-soft);text-wrap:balance}
.next.wide{width:100%}
.next.alt{background:var(--card);border-color:var(--line);box-shadow:0 4px 0 var(--line);color:var(--ink)}
.next.alt:active{box-shadow:0 2px 0 var(--line)}
.next.sm{font-size:15px;padding:0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.next[hidden]{display:none}
.subhead{display:flex;align-items:center;gap:10px}
.subhead h2{margin:0;font-size:22px;font-weight:900}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;color:var(--ink)}
.pcard[data-w="treasure"]{
  --ink:#f3ead2;--ink-soft:#b9b09a;--card:#16203a;--line:#37435f;--acc:#e8c35a;
  --lv0:#1f6b52;--lv1:#6b5a1f;--lv2:#7a3a4a;--lv3:#4d3d8a;--lv-ink:#fff7e0;
  background:linear-gradient(160deg,#17243f,#0f2b2a);
}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.ph h3{margin:0;font-size:17px;font-weight:900}
.done{font-size:12px;font-weight:900;border-radius:999px;padding:3px 10px;background:var(--acc);color:#fff}
.pcard[data-w="treasure"] .done{color:#1b1403}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.slot img{width:100%;aspect-ratio:1;border-radius:22%;object-fit:cover;display:block;box-sizing:border-box;filter:grayscale(1) brightness(.9);opacity:.28;border:2px dashed var(--line)}
.slot.on img{filter:none;opacity:1;border:2px solid var(--acc);box-shadow:0 2px 0 var(--acc)}
.slot small{font-size:10px;font-weight:700;line-height:1.2;text-align:center;color:var(--ink-soft)}
.slot.on small{color:var(--ink)}
.slot em{position:absolute;top:-5px;right:-3px;font-style:normal;font-size:10px;font-weight:900;border-radius:999px;padding:0 5px;background:var(--acc);color:#fff}
.pcard[data-w="treasure"] .slot em{color:#1b1403}
.cnt{margin:10px 0 0;text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft)}
.mini{width:100%;max-width:300px;gap:6px}
.mini .slot small,.mini .slot em{display:none}
.mini .slot.new img{animation:stampin .8s cubic-bezier(.2,1.4,.4,1) .5s backwards}
@keyframes stampin{0%{transform:scale(2.4) rotate(-18deg);opacity:0}100%{transform:none;opacity:1}}
.best{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;font-weight:700;font-size:14px}
.best b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rows li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.rows li span:nth-child(2){flex:1;min-width:0}
.rows b{font-variant-numeric:tabular-nums;font-weight:900}
.rows .lv{flex:none;min-width:2.8em;text-align:center}
.rows .none{color:var(--ink-soft);font-weight:700}
.clear .time{white-space:pre-line}
</style>
</head>
<body>


<div class="app">

  <!-- ===== home ===== -->
  <div class="view" id="v-home">
    <div class="hero">
      <div class="row" id="hero"></div>
      <h1>秘密の種と宝探し</h1>
      <p class="en">Secret Seeds &amp; Treasure Hunt</p>
    </div>
    <p class="resume" id="resume"></p>
    <button class="next wide" id="h-cont" type="button">つづきから</button>
    <button class="next wide alt" id="h-new" type="button">はじめから</button>
    <div class="two">
      <button class="next alt sm" id="h-stamps" type="button">🎫 スタンプカード</button>
      <button class="next alt sm" id="h-rec" type="button">⏱ きろく</button>
    </div>
    <p class="note" id="savenote"></p>
    <p class="note" style="margin-top:10px;font-weight:500;opacity:.8">画像：ChatGPTで生成</p>
  </div>

  <!-- ===== game ===== -->
  <div class="view" id="v-game" hidden>
    <header class="head">
      <div>
        <h1>秘密の種と宝探し</h1>
        <p class="en" id="en"></p>
      </div>
      <button class="ibtn" id="go-home" type="button" aria-label="ホームにもどる">🏠</button>
    </header>

    <div class="bar">
      <div class="pill"><span class="lv" id="lv">初級</span><span><span id="unit">ステージ</span> <b id="stage">1</b>/10</span></div>
      <div class="pill rem"><img id="itemico" alt="" width="28" height="28"><span>のこり</span><b id="left">8</b></div>
    </div>

    <div class="toolrow">
      <div class="timer" aria-label="タイム"><span>⏱ <b id="t-stage">0:00</b></span><span>ぜんぶで <b id="t-run">0:00</b></span></div>
      <div class="tools">
        <button class="ibtn" id="btn-bgm" type="button" aria-pressed="true" aria-label="BGM">🎵</button>
        <button class="ibtn" id="btn-se" type="button" aria-pressed="true" aria-label="効果音">🔊</button>
        <button class="ibtn" id="reset" type="button" aria-label="やりなおす">↻</button>
      </div>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

    <div class="box">
      <div class="grid" id="board" role="group" aria-label="9×9マスのお庭"></div>
    </div>

    <div class="howto" id="howto">
      <div class="hcard"><span class="hi">👆</span><div><b>タップ</b><small id="how-tap"></small></div></div>
      <div class="hcard"><span class="hi">👇</span><div><b>長押し</b><small id="how-hold"></small></div></div>
    </div>

    <section class="clear" id="clear" hidden>
      <p id="clear-sub"></p>
      <p class="time" id="clear-time"></p>
      <div class="slots mini" id="clear-card"></div>
      <p id="clear-card-note"></p>
      <button class="next" id="next" type="button">次のステージへ</button>
      <button class="next alt sm" id="clear-stamps" type="button" hidden>🎫 スタンプカードを見る</button>
    </section>

    <details class="how">
      <summary>あそびかた</summary>
      <ul id="how-list"></ul>
    </details>

    <details class="how">
      <summary>BGMの音色</summary>
      <div class="seg" id="seg" role="radiogroup" aria-label="BGMの音色">
        <button type="button" role="radio" data-v="auto" aria-checked="true">おまかせ（指定の音）</button>
        <button type="button" role="radio" data-v="musicbox" aria-checked="true">オルゴール</button>
        <button type="button" role="radio" data-v="organ" aria-checked="false">オルガン</button>
        <button type="button" role="radio" data-v="harp" aria-checked="false">ハープ</button>
        <button type="button" role="radio" data-v="marimba" aria-checked="false">マリンバ</button>
      </div>
    </details>
  </div>

  <!-- ===== stamp card ===== -->
  <div class="view" id="v-stamps" hidden>
    <div class="subhead"><button class="ibtn" data-go="home" type="button" aria-label="ホームにもどる">←</button><h2>スタンプカード</h2></div>
    <div id="stamp-body" class="view"></div>
  </div>

  <!-- ===== records ===== -->
  <div class="view" id="v-records" hidden>
    <div class="subhead"><button class="ibtn" data-go="home" type="button" aria-label="ホームにもどる">←</button><h2>きろく</h2></div>
    <div id="rec-body" class="view"></div>
  </div>
</div>

<div class="fall" id="fall" aria-hidden="true"></div>

    try { localStorage.setItem(LS_KEY, JSON.stringify(P)); LS.ok = true; } catch (e) { LS.ok = false; }
  }
  var P = sane(lsRead());

  var DB = { ref: null, ok: false, failed: false, busy: false, dirty: false, timer: 0, sent: '', retried: false };
  function schedDb() {
    if (!DB.ref || DB.failed) return;
    clearTimeout(DB.timer);
    DB.timer = setTimeout(flushDb, 700);
  }
  function flushDb() {
    if (!DB.ref || DB.failed) return;
    if (DB.busy) { DB.dirty = true; return; }
    var str = JSON.stringify(P);
    if (str === DB.sent) return;
    DB.busy = true;
    DB.ref.set({ t: P.t, json: str }).then(function () {
      DB.sent = str; DB.retried = false;
    }, function (e) {
      if (e && e.code === 'unavailable' && !DB.retried) { DB.retried = true; DB.dirty = true; return; }
      if (e && e.code === 'unavailable') return;
      DB.failed = true; updateNote();
    }).then(function () {
      DB.busy = false;
      if (DB.dirty) { DB.dirty = false; clearTimeout(DB.timer); DB.timer = setTimeout(flushDb, 2000); }
    });
  }
  function commit() {
    P.t = Date.now();
    lsWrite();
    schedDb();
  }
  function updateNote() {
    noteEl.textContent = DB.ok && !DB.failed ? '☁️ きろくは自動でほぞんされるよ。'
      : LS.ok ? '📱 きろくはこの端末にほぞんされるよ。（ブラウザの設定などで消えることがあるよ）'
      : '⚠️ ほぞんできない環境みたい。とじるときろくは消えちゃうよ。';
  }
  function attachDb() {
    var cl = window.claude;
    if (!cl || !cl.use) return;
    Promise.all([cl.use('db'), cl.use('user')]).then(function (r) {
      var d = r[0], u = r[1];
      if (!d || !u || !u.id) return null;
      return u.id().then(function (id) {
        if (!id) return null;
        var ref = d.doc('data/users/' + id + '/save');
        return ref.get().then(function (snap) {
          var remote = null;
          if (snap.exists) {
            var dat = snap.data() || {};
            try { remote = sane(JSON.parse(dat.json)); } catch (e) { remote = null; }
          }
          DB.ref = ref; DB.ok = true;
          if (remote && remote.t > P.t && view !== 'game') {
            P = remote; lsWrite(); DB.sent = JSON.stringify(P); renderHome();
          } else if (P.t > 0 && (!remote || remote.t < P.t)) {
            flushDb();
          } else if (remote) DB.sent = JSON.stringify(P);
          updateNote();
        });
      });
    }).catch(function () { DB.ok = false; updateNote(); });
  }

  /* ---------- timer (stage time + whole-run time) ---------- */
  var TM = { ms: 0, since: 0, running: false, hidePause: false };
  function tNow() { return TM.ms + (TM.running ? performance.now() - TM.since : 0); }
  function tStart() { if (TM.running || G.cleared) return; TM.running = true; TM.since = performance.now(); }
  function tPause() { if (!TM.running) return; TM.ms += performance.now() - TM.since; TM.running = false; }
  function tReset() { TM.ms = 0; TM.running = false; TM.hidePause = false; renderTimer(); }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function fmt(ms, dec) {
    if (ms == null) return '—';
    var q = Math.floor(ms / 100), m = Math.floor(q / 600), sec = Math.floor(q % 600 / 10);
    return m + ':' + pad2(sec) + (dec ? '.' + (q % 10) : '');
  }
  function renderTimer() {
    var now = tNow();
    tStageEl.textContent = fmt(now, 0);
    tRunEl.textContent = fmt(G.runBase + now, 0);
  }
  setInterval(function () { if (view === 'game' && TM.running) renderTimer(); }, 200);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (TM.running) { TM.hidePause = true; tPause(); } }
    else if (TM.hidePause) { TM.hidePause = false; if (view === 'game' && !G.cleared) tStart(); }
  });

  /* ---------- board ---------- */
  var nb = [], i, k;
  for (i = 0; i < T; i++) {
    var r = Math.floor(i / N), c = i % N, arr = [];
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      var rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < N && cc >= 0 && cc < N) arr.push(rr * N + cc);
    }
    nb.push(arr);
  }
  var cells = [];
  for (k = 0; k < T; k++) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'cell'; b.dataset.i = k;
    boardEl.appendChild(b); cells.push(b);
  }

  var G = { world: 'flower', W: WORLDS.flower, stage: 0, runBase: 0, total: 8, seed: null, count: null, safe: [], claim: [], found: [], cleared: false };

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function fx(el, cls, ms) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(function () { el.classList.remove(cls); }, ms || 700);
  }
  function say(t) { statusEl.textContent = t; fx(statusEl, 'pop', 400); }
  function claimCount() { var n = 0; for (var i = 0; i < T; i++) if (G.claim[i]) n++; return n; }
  function updateLeft() { leftEl.textContent = Math.max(0, G.total - claimCount()); }

  function renderCell(i) {
    var el = cells[i], rowN = Math.floor(i / N) + 1, colN = i % N + 1, W = G.W;
    var cls = 'cell', html = '', st = '';
    if (G.claim[i]) {
      cls += ' claim';
      html = W.key === 'flower' ? '<span class="g">' + W.claimGlyph + '</span>' : '<span class="g gold">' + GOLD + '</span>';
      st = W.key === 'flower' ? 'お水をあげたマス' : '掘ったマス';
    } else if (G.found[i]) {
      cls += ' found';
      html = '<span class="g">' + W.foundGlyph + '</span>';
      st = W.short + 'があるマス';
    } else if (G.safe[i]) {
      cls += ' safe';
      var n = G.count[i];
      if (n > 0) cls += ' n' + n;
      if (W.key === 'treasure') html = '<svg class="mk' + (n === 0 ? ' zero' : '') + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5L19 19M19 5L5 19"/></svg>';
      if (n > 0) html += '<span class="g">' + n + '</span>';
      st = n > 0 ? 'まわりに' + W.short + 'が' + n + 'つ' : 'まわりに' + W.short + 'なし';
    } else st = 'まだしらべていないマス';
    el.className = cls;
    el.innerHTML = html;
    el.setAttribute('aria-label', rowN + '行' + colN + '列、' + st);
  }

  /* ---- no-guess generation ----
     A layout is accepted only if a player who starts at the first tap can find every seed by logic alone:
     (1) a number that already has all its seeds marks the rest of its neighbours safe,
     (2) a number that needs all its unknown neighbours marks them all as seeds,
     (3) if one number's unknown cells sit inside another's, the difference is decided,
     (4) the total seed count settles the leftovers. */
  function solveScore(seed, count, start, total) {
    var st = new Array(T).fill(0), mines = 0, i, q, qi;
    function open(s) {
      if (st[s] !== 0) return;
      q = [s]; st[s] = 1;
      for (qi = 0; qi < q.length; qi++) {
        var c = q[qi];
        if (count[c] === 0) nb[c].forEach(function (j) { if (st[j] === 0) { st[j] = 1; q.push(j); } });
      }
    }
    open(start);
    var progress = true;
    while (progress && mines < total) {
      progress = false;
      var cons = [], toSafe = new Array(T).fill(false), toMine = new Array(T).fill(false), unk = 0;
      for (i = 0; i < T; i++) {
        if (st[i] === 0) unk++;
        if (st[i] === 1 && count[i] > 0) {
          var u = [], m = count[i];
          for (var a = 0; a < nb[i].length; a++) {
            var j = nb[i][a];
            if (st[j] === 0) u.push(j); else if (st[j] === 2) m--;
          }
          if (u.length) cons.push({ u: u, m: m });
        }
      }
      var x, y, z;
      for (x = 0; x < cons.length; x++) {
        var C = cons[x];
        if (C.m === 0) C.u.forEach(function (j) { toSafe[j] = true; });
        else if (C.m === C.u.length) C.u.forEach(function (j) { toMine[j] = true; });
      }
      var mark = new Array(T).fill(false);
      for (x = 0; x < cons.length; x++) {
        var B = cons[x];
        B.u.forEach(function (j) { mark[j] = true; });
        for (y = 0; y < cons.length; y++) {
          var A = cons[y];
          if (A === B || A.u.length >= B.u.length) continue;
          var sub = true;
          for (z = 0; z < A.u.length; z++) if (!mark[A.u[z]]) { sub = false; break; }
          if (!sub) continue;
          var inA = {}, diff = [];
          A.u.forEach(function (j) { inA[j] = true; });
          B.u.forEach(function (j) { if (!inA[j]) diff.push(j); });
          var dm = B.m - A.m;
          if (dm === 0) diff.forEach(function (j) { toSafe[j] = true; });
          else if (dm === diff.length) diff.forEach(function (j) { toMine[j] = true; });
        }
        B.u.forEach(function (j) { mark[j] = false; });
      }
      if (mines === total) { /* done */ }
      else if (unk === total - mines) for (i = 0; i < T; i++) if (st[i] === 0) toMine[i] = true;
      for (i = 0; i < T; i++) {
        if (toMine[i] && st[i] === 0) { st[i] = 2; mines++; progress = true; }
      }
      if (mines === total) break;
      for (i = 0; i < T; i++) {
        if (toSafe[i] && st[i] === 0) { open(i); progress = true; }
      }
    }
    lastSt = st;
    return mines;
  }
  var lastSt = null;

  function layout(safeIdx) {
    var banned = {}; banned[safeIdx] = true;
    nb[safeIdx].forEach(function (j) { banned[j] = true; });
    var pool = [], i, seed = new Array(T).fill(false), count = new Array(T).fill(0);
    for (i = 0; i < T; i++) if (!banned[i]) pool.push(i);
    shuffle(pool);
    for (i = 0; i < G.total; i++) seed[pool[i]] = true;
    for (i = 0; i < T; i++) {
      var n = 0;
      nb[i].forEach(function (j) { if (seed[j]) n++; });
      count[i] = n;
    }
    return { seed: seed, count: count };
  }

  function recount(L) {
    for (var i = 0; i < T; i++) {
      var n = 0;
      nb[i].forEach(function (j) { if (L.seed[j]) n++; });
      L.count[i] = n;
    }
  }
  function rate(L, safeIdx) {
    var m = solveScore(L.seed, L.count, safeIdx, G.total), opened = 0;
    for (var i = 0; i < T; i++) if (lastSt[i] === 1) opened++;
    return { mines: m, score: m * 100 + opened };
  }
  /* Start from a random layout. While some seeds are still undecidable, move one of them
     into another undecided cell and keep the change if it is no worse (hill climbing). */
  function generate(safeIdx) {
    var best = null, bestScore = -1, t0 = performance.now(), L, r, step, i;
    var done = false;
    while (!done && (performance.now() - t0 < 1500 || !best)) {
      L = layout(safeIdx);
      r = rate(L, safeIdx);
      for (step = 0; step < 500 && r.mines < G.total; step++) {
        var us = [], uf = [];
        for (i = 0; i < T; i++) if (lastSt[i] === 0) (L.seed[i] ? us : uf).push(i);
        if (!us.length || !uf.length) break;
        var a = us[Math.floor(Math.random() * us.length)], b = uf[Math.floor(Math.random() * uf.length)];
        L.seed[a] = false; L.seed[b] = true; recount(L);
        var r2 = rate(L, safeIdx);
        if (r2.score >= r.score) r = r2;
        else { L.seed[a] = true; L.seed[b] = false; recount(L); r = rate(L, safeIdx); }
      }
      if (r.score > bestScore) { best = { seed: L.seed.slice(), count: L.count.slice() }; bestScore = r.score; }
      if (r.mines === G.total) done = true;
    }
    G.seed = best.seed;
    G.count = best.count;
    G.noGuess = done;
  }

  function reveal(start) {
    var q = [[start, 0]], seen = {}, out = [], unclaimed = 0;
    seen[start] = true;
    while (q.length) {
      var cur = q.shift(), kk = cur[0];
      if (G.claim[kk]) { G.claim[kk] = false; unclaimed++; }
      G.safe[kk] = true;
      out.push(cur);
      if (G.count[kk] === 0) {
        nb[kk].forEach(function (j) {
          if (!seen[j] && !G.safe[j]) { seen[j] = true; q.push([j, cur[1] + 1]); }
        });
      }
    }
    out.unclaimed = unclaimed;
    return out;
  }

  function primary(i) {
    var W = G.W;
    tStart();
    if (G.claim[i]) { fx(cells[i], 'fx-shake', 320); say(W.claimedTap); Sound.se('soft'); return; }
    if (G.safe[i]) { fx(cells[i], 'fx-shake', 320); say(W.safeTap); Sound.se('soft'); return; }
    if (G.found[i]) { fx(cells[i], 'fx-found', 1500); say(W.foundMsg); Sound.se('hint'); return; }
    if (!G.seed) generate(i);
    if (G.seed[i]) {
      G.found[i] = true;
      renderCell(i);
      fx(cells[i], 'fx-found', 1500);
      say(W.foundMsg);
      Sound.se('hint');
      return;
    }
    var list = reveal(i);
    list.forEach(function (p) {
      var el = cells[p[0]], ms = p[1] * 45;
      renderCell(p[0]);
      el.style.setProperty('--d', ms + 'ms');
      fx(el, 'fx-reveal', ms + 500);
    });
    updateLeft();
    Sound.se(W.key === 'flower' ? 'brick' : 'cross');
    if (list.length > 1) Sound.se('flood', list.length);
    var n = G.count[i];
    var msg = n === 0 ? W.zeroMsg : W.countMsg(n);
    if (list.unclaimed) msg += '（まちがえて印をつけていたマスは戻したよ）';
    say(msg);
  }

  function secondary(i) {
    var W = G.W;
    tStart();
    if (G.safe[i]) { fx(cells[i], 'fx-shake', 320); say(W.safeHold); Sound.se('soft'); return; }
    G.claim[i] = !G.claim[i];
    renderCell(i);
    if (G.claim[i]) {
      fx(cells[i], 'fx-sprout', 700);
      say(pick(W.claimMsgs));
      Sound.se(W.key === 'flower' ? 'water' : 'dig');
    } else {
      say(W.unclaimMsg);
      Sound.se('undo');
    }
    updateLeft();
    checkWin();
  }

  function checkWin() {
    if (!G.seed) return;
    var n = 0, ok = true;
    for (var i = 0; i < T; i++) if (G.claim[i]) { n++; if (!G.seed[i]) ok = false; }
    if (n === G.total && ok) win();
    else if (n === G.total) say(G.W.wrongMsg);
  }

  function recordClear(ms) {
    var w = G.world, s = G.stage, last = s === STAGES.length - 1, B = P.best[w], prev = B.stages[s];
    var rc = { ms: ms, stage: s, stageNew: false, stageFirst: false, totalNew: false, totalFirst: false };
    if (prev == null || ms < prev) { rc.stageNew = true; rc.stageFirst = prev == null; B.stages[s] = ms; }
    P.got[w][s]++;
    P.stamp[w].card[s] = true;
    G.runBase += ms;
    rc.total = G.runBase;
    rc.card = P.stamp[w].card.slice();
    if (last) {
      if (B.total == null || G.runBase < B.total) { rc.totalNew = true; rc.totalFirst = B.total == null; B.total = G.runBase; }
      P.stamp[w].cards++;
      P.stamp[w].card = new Array(10).fill(false);
      P.run = null;
    } else {
      P.run = { world: w, stage: s + 1, elapsed: G.runBase };
    }
    rc.cards = P.stamp[w].cards;
    commit();
    return rc;
  }

  function slotsHtml(w, flags, newIdx, full) {
    var h = '', i;
    for (i = 0; i < 10; i++) {
      var on = !!flags[i];
      h += '<div class="slot' + (on ? ' on' : '') + (i === newIdx ? ' new' : '') + '"><img src="' + ICONS[w][i] + '" alt="">' +
        (full ? '<small>' + (on ? WORLDS[w].names[i] : '？？？') + '</small>' + (P.got[w][i] > 1 ? '<em>×' + P.got[w][i] + '</em>' : '') : '') + '</div>';
    }
    return h;
  }

  /* ---------- views ---------- */
  var view = 'home';
  function show(name) {
    if (view === 'game' && name !== 'game') { tPause(); Sound.stopBgm(); Sound.stopCelebrate(); fallEl.innerHTML = ''; }
    view = name;
    Object.keys(VIEWS).forEach(function (k) { VIEWS[k].hidden = k !== name; });
    document.documentElement.dataset.world = name === 'game' ? G.world : 'flower';
    if (name === 'home') renderHome();
    if (name === 'stamps') renderStamps();
    if (name === 'records') renderRecords();
    window.scrollTo(0, 0);
  }
  function renderHome() {
    var r = P.run, W = r && WORLDS[r.world];
    $('h-cont').hidden = !r;
    $('h-new').textContent = r ? 'はじめから' : 'あそぶ';
    $('resume').textContent = r
      ? 'つづき：' + LABEL[r.world] + ' ' + W.unit + (r.stage + 1) + '（' + LV_NAMES[STAGES[r.stage].lv] + '）から'
      : 'お花畑か宝島、どちらかがランダムで決まるよ。';
    var hero = $('hero');
    if (!hero.firstChild) {
      hero.innerHTML = [['flower', 0], ['treasure', 1], ['flower', 2], ['treasure', 4], ['flower', 4]].map(function (p, n) {
        return '<img src="' + ICONS[p[0]][p[1]] + '" alt="" style="--d:' + (n * 0.25) + 's">';
      }).join('');
    }
    updateNote();
  }
  function renderStamps() {
    $('stamp-body').innerHTML = WK.map(function (w) {
      var S = P.stamp[w], n = S.card.filter(Boolean).length;
      return '<section class="pcard" data-w="' + w + '"><div class="ph"><h3>' + (w === 'flower' ? '🌸 お花畑カード' : '💎 宝島カード') +
        '</h3><span class="done">かんせい ×' + S.cards + '</span></div><div class="slots">' + slotsHtml(w, S.card, -1, true) +
        '</div><p class="cnt">' + n + ' / 10 あつまったよ</p></section>';
    }).join('') + '<p class="note">10こ そろえてぜんぶクリアすると、カードが1まいかんせい。つぎの新しいカードがはじまるよ。</p>';
  }
  function renderRecords() {
    $('rec-body').innerHTML = WK.map(function (w) {
      var B = P.best[w], W = WORLDS[w], rows = '';
      STAGES.forEach(function (st, i) {
        var t = B.stages[i];
        rows += '<li><span class="lv lv' + st.lv + '">' + LV_NAMES[st.lv] + '</span><span>' + (i + 1) + ' ' + W.names[i] + '</span>' +
          (t == null ? '<span class="none">—</span>' : '<b>' + fmt(t, 1) + '</b>') + '</li>';
      });
      return '<section class="pcard" data-w="' + w + '"><div class="ph"><h3>' + (w === 'flower' ? '🌸 お花畑' : '💎 宝島') +
        '</h3><span class="done">かんせい ×' + P.stamp[w].cards + '</span></div>' +
        '<div class="best"><span>ぜんぶクリア ベスト</span><b>' + fmt(B.total, 1) + '</b></div><ul class="rows">' + rows + '</ul></section>';
    }).join('') + '<p class="note">ステージのとちゅうでホームにもどると、そのステージはやりなおし（タイムも0から）になるよ。</p>';
  }

  function win() {
    tPause();
    var rc = recordClear(Math.round(tNow()));
    G.cleared = true;
    boardEl.classList.add('done');
    var W = G.W, mid = (N - 1) / 2, last = G.stage === STAGES.length - 1;
    for (var i = 0; i < T; i++) {
      var el = cells[i];
      if (G.seed[i]) {
        el.className = 'cell ' + (W.key === 'flower' ? 'bloom' : 'rise');
        el.innerHTML = '';
        el.style.setProperty('--d', Math.floor(Math.random() * 140) + 'ms');
      } else if (W.key === 'flower' && !G.safe[i]) {
        var dist = Math.abs(Math.floor(i / N) - mid) + Math.abs(i % N - mid);
        el.className = 'cell meadow';
        el.innerHTML = '<span class="g"></span>';
        el.style.setProperty('--d', Math.floor(700 + dist * 70 + Math.random() * 120) + 'ms');
      }
    }
    statusEl.classList.add('celebrate');
    statusEl.textContent = last ? W.finalMsg : W.clearMsg;
    fx(statusEl, 'pop', 400);
    if (last) {
      clearSub.textContent = W.finalSub;
      nextBtn.textContent = 'もう一度あそぶ';
    } else {
      var nx = STAGES[G.stage + 1];
      clearSub.textContent = W.unit + (G.stage + 1) + 'をクリア！つぎは ' + LV_NAMES[nx.lv] + '、かくれているのは' + nx.n + 'こ。';
      nextBtn.textContent = W.nextLabel;
    }
    renderTimer();
    var tl = 'タイム ' + fmt(rc.ms, 1);
    if (rc.stageNew) tl += rc.stageFirst ? '（はじめてのきろく！）' : '　🎉ベスト更新！';
    if (last) {
      tl += '\nぜんぶで ' + fmt(rc.total, 1);
      if (rc.totalNew) tl += rc.totalFirst ? '（はじめてのきろく！）' : '　🎉ベスト更新！';
    }
    clearTime.textContent = tl;
    clearCard.dataset.w = G.world;
    clearCard.innerHTML = slotsHtml(G.world, rc.card, rc.stage, false);
    clearCardNote.textContent = last ? '🎫 スタンプカードが1まいかんせい！（これで ' + rc.cards + ' まい）' : '🎫 スタンプ ゲット！（' + rc.card.filter(Boolean).length + '/10）';
    clearStamps.hidden = !last;
    howtoEl.hidden = true;
    clearEl.hidden = false;
    disarm();
    resetBtn.disabled = true;
    startFall();
    Sound.stopBgm();
    Sound.celebrate(G.world);
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function () {
      if (G.cleared) clearEl.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
    }, 1400);
  }

  function startFall() {
    fallEl.innerHTML = '';
    var j, p, s;
    if (G.world === 'flower') {
      var cols = G.W.petals[G.stage];
      for (j = 0; j < 36; j++) {
        p = document.createElement('i'); p.className = 'petal'; s = 10 + Math.random() * 14;
        p.style.cssText =
          'left:' + (Math.random() * 100).toFixed(1) + '%;' +
          'width:' + s.toFixed(1) + 'px;height:' + (s * 0.8).toFixed(1) + 'px;' +
          'background:' + cols[j % cols.length] + ';' +
          'animation-duration:' + (6 + Math.random() * 6).toFixed(1) + 's;' +
          'animation-delay:' + (Math.random() * 4).toFixed(1) + 's;' +
          '--drift:' + ((Math.random() - 0.5) * 220).toFixed(0) + 'px;' +
          '--spin:' + Math.floor(360 + Math.random() * 540) + 'deg';
        fallEl.appendChild(p);
      }
    } else {
      for (j = 0; j < 34; j++) {
        p = document.createElement('i'); p.className = 'coin'; s = 18 + Math.random() * 12;
        p.style.cssText =
          'left:' + (Math.random() * 100).toFixed(1) + '%;' +
          'width:' + s.toFixed(1) + 'px;height:' + s.toFixed(1) + 'px;' +
          'animation-duration:' + (2.4 + Math.random() * 2.2).toFixed(1) + 's;' +
          'animation-delay:' + (Math.random() * 3).toFixed(1) + 's;' +
          '--drift:' + ((Math.random() - 0.5) * 120).toFixed(0) + 'px;' +
          '--spin:' + Math.floor(720 + Math.random() * 720) + 'deg';
        fallEl.appendChild(p);
      }
    }
  }

  function newStage() {
    var st = STAGES[G.stage], W = G.W, i;
    G.total = st.n; G.seed = null; G.count = null; G.cleared = false;
    G.safe = new Array(T).fill(false);
    G.claim = new Array(T).fill(false);
    G.found = new Array(T).fill(false);
    var uri = ICONS[G.world][G.stage];
    boardEl.style.setProperty('--ico', 'url("' + uri + '")');
    itemIco.src = uri;
    boardEl.classList.remove('done');
    resetBtn.disabled = false;
    fallEl.innerHTML = '';
    clearEl.hidden = true;
    howtoEl.hidden = false;
    statusEl.classList.remove('celebrate');
    for (i = 0; i < T; i++) { cells[i].style.removeProperty('--d'); renderCell(i); }
    lvEl.textContent = LV_NAMES[st.lv];
    lvEl.className = 'lv lv' + st.lv;
    stageEl.textContent = G.stage + 1;
    updateLeft();
    say(W.startMsg(W.names[G.stage], st.n));
    Sound.stopCelebrate();
    Sound.playBgm(G.world);
    tReset();
  }

  function enter() {
    var r = P.run, world = r.world;
    G.world = world; G.W = WORLDS[world]; G.stage = r.stage; G.runBase = r.elapsed;
    show('game');
    enEl.textContent = G.W.en;
    $('unit').textContent = G.W.unit;
    $('how-tap').textContent = G.W.tapText;
    $('how-hold').textContent = G.W.holdText;
    $('how-list').innerHTML = G.W.howList.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    newStage();
  }
  function newRun(world) {
    P.run = { world: world || pick(WK), stage: 0, elapsed: 0 };
    commit();
    enter();
  }

  /* ---------- input: tap = primary, long press = secondary ---------- */
  var press = null;
  function cancelPress() {
    if (!press) return;
    clearTimeout(press.timer);
    cells[press.i].classList.remove('pressing');
    press = null;
  }
  boardEl.addEventListener('pointerdown', function (e) {
    var el = e.target.closest('.cell');
    if (!el || G.cleared) return;
    var idx = Number(el.dataset.i);
    if (e.pointerType === 'mouse' && e.button === 2) { secondary(idx); return; }
    if (e.button > 0) return;
    cancelPress();
    press = { i: idx, x: e.clientX, y: e.clientY, fired: false, timer: 0 };
    el.classList.add('pressing');
    var cur = press;
    cur.timer = setTimeout(function () {
      if (press !== cur) return;
      cur.fired = true;
      el.classList.remove('pressing');
      secondary(idx);
    }, LONG_MS);
  });
  boardEl.addEventListener('pointermove', function (e) {
    if (press && !press.fired && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 14) cancelPress();
  });
  boardEl.addEventListener('pointerup', function () {
    if (!press) return;
    var p = press;
    clearTimeout(p.timer);
    cells[p.i].classList.remove('pressing');
    press = null;
    if (!p.fired && !G.cleared) primary(p.i);
  });
  boardEl.addEventListener('pointercancel', cancelPress);
  boardEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  boardEl.addEventListener('selectstart', function (e) { e.preventDefault(); });
  boardEl.addEventListener('click', function (e) {
    if (e.detail !== 0 || G.cleared) return;
    var el = e.target.closest('.cell');
    if (el) primary(Number(el.dataset.i));
  });
  boardEl.addEventListener('keydown', function (e) {
    if (e.shiftKey && (e.key === 'Enter' || e.key === ' ')) {
      var el = e.target.closest('.cell');
      if (el && !G.cleared) { e.preventDefault(); secondary(Number(el.dataset.i)); }
    }
  });

  /* ---------- buttons ---------- */
  function syncSoundButtons() {
    btnBgm.setAttribute('aria-pressed', String(Sound.on.bgm));
    btnSe.setAttribute('aria-pressed', String(Sound.on.se));
  }
  btnBgm.addEventListener('click', function () { Sound.setBgm(!Sound.on.bgm); syncSoundButtons(); });
  btnSe.addEventListener('click', function () { Sound.setSe(!Sound.on.se); syncSoundButtons(); });

  nextBtn.addEventListener('click', function () {
    if (G.stage >= STAGES.length - 1) {
      newRun();
    } else {
      G.stage++;
      newStage();
    }
    window.scrollTo(0, 0);
  });

  var armed = false, armTimer = 0;
  function disarm() { armed = false; clearTimeout(armTimer); resetBtn.classList.remove('armed'); }
  resetBtn.addEventListener('click', function () {
    if (G.cleared) return;
    var progress = G.safe.some(Boolean) || G.claim.some(Boolean) || G.found.some(Boolean);
    if (!progress || armed) { disarm(); newStage(); return; }
    armed = true;
    resetBtn.classList.add('armed');
    say('もう一度 ↻ をタップすると、このステージをやりなおすよ。');
    armTimer = setTimeout(disarm, 3500);
  });

  var segEl = $('seg');
  function syncSeg() {
    [].forEach.call(segEl.children, function (b) { b.setAttribute('aria-checked', String(b.dataset.v === Sound.on.voice)); });
  }
  segEl.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    Sound.unlock();
    Sound.setVoice(b.dataset.v);
    syncSeg();
  });
  syncSeg();

  /* ---------- home / navigation ---------- */
  function confirmTap(btn, msg, out, fn) {
    if (btn._armed) { clearTimeout(btn._t); btn._armed = false; btn.classList.remove('armed'); fn(); return; }
    btn._armed = true; btn.classList.add('armed'); out(msg);
    btn._t = setTimeout(function () { btn._armed = false; btn.classList.remove('armed'); }, 3500);
  }
  $('h-cont').addEventListener('click', function () { if (P.run) enter(); });
  $('h-new').addEventListener('click', function () {
    var b = this;
    if (!P.run) { newRun(); return; }
    confirmTap(b, 'いまのつづきは消えて、新しくはじまるよ。もう一度タップではじめから。', function (t) { $('resume').textContent = t; }, function () { newRun(); });
  });
  $('h-stamps').addEventListener('click', function () { show('stamps'); });
  $('h-rec').addEventListener('click', function () { show('records'); });
  clearStamps.addEventListener('click', function () { show('stamps'); });
  [].forEach.call(document.querySelectorAll('[data-go]'), function (b) {
    b.addEventListener('click', function () { show(b.dataset.go); });
  });
  $('go-home').addEventListener('click', function () {
    var progress = !G.cleared && (G.safe.some(Boolean) || G.claim.some(Boolean) || G.found.some(Boolean));
    if (!progress) { show('home'); return; }
    confirmTap(this, 'ホームにもどると、このステージはやりなおしになるよ。もう一度🏠をタップでもどる。', say, function () { show('home'); });
  });

  syncSoundButtons();
  lsWrite();
  show('home');
  attachDb();
})();
</script>
<script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
